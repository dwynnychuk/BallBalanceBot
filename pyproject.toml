[project]
name = "ballbalancebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dwynnychuk", email = "dwynnychuk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "adafruit-circuitpython-servokit>=1.3.24",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pre-commit>=4.6.2"
]

[project.scripts]
ballbalancebot = "ballbalancebot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
